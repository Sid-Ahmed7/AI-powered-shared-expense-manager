name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

permissions:
    contents: read

jobs:
    backend:
        name: Backend – Build & Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 25
                cache: maven

            - name: Compilation
              run: mvn clean compile -DskipTests -B

            - name: Tests unitaires
              run: mvn test -B -Dtest="com.pactole.common.**,com.pactole.security.**,com.pactole.services.**" -DfailIfNoTests=false

            - name: Tests d'intégration
              run: mvn test -B -Dtest="com.pactole.controller.**,com.pactole.PactoleApplicationTests" -DfailIfNoTests=false
              env:
                SPRING_PROFILES_ACTIVE: test
                PACTOLE_SECURITY_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
                PACTOLE_SECURITY_JWT_ISSUER: ${{ secrets.TEST_JWT_ISSUER }}
                PACTOLE_SECURITY_JWT_AUDIENCE: ${{ secrets.TEST_JWT_AUDIENCE }}
                PACTOLE_SECURITY_JWT_ACCESS_TOKEN_MINUTES: ${{ secrets.TEST_JWT_ACCESS_TOKEN_MINUTES }}
                PACTOLE_SECURITY_JWT_SESSION_CLAIM: ${{ secrets.TEST_JWT_SESSION_CLAIM }}
                PACTOLE_SECURITY_REFRESH_COOKIE_NAME: ${{ secrets.TEST_REFRESH_COOKIE_NAME }}
                PACTOLE_SECURITY_REFRESH_COOKIE_SECURE: ${{ secrets.TEST_REFRESH_COOKIE_SECURE }}
                PACTOLE_SECURITY_REFRESH_SLIDING_DAYS: ${{ secrets.TEST_REFRESH_SLIDING_DAYS }}
                PACTOLE_SECURITY_REFRESH_ABSOLUTE_DAYS: ${{ secrets.TEST_REFRESH_ABSOLUTE_DAYS }}
                PACTOLE_SECURITY_REFRESH_REUSE_GRACE_SECONDS: ${{ secrets.TEST_REFRESH_REUSE_GRACE_SECONDS }}
                PACTOLE_SECURITY_LOCKOUT_MAX_FAILURES: ${{ secrets.TEST_LOCKOUT_MAX_FAILURES }}
                PACTOLE_SECURITY_LOCKOUT_DURATION_MINUTES: ${{ secrets.TEST_LOCKOUT_DURATION_MINUTES }}
                PACTOLE_SECURITY_RATE_LIMITS_GLOBAL_PER_IP_PER_MINUTE: ${{ secrets.TEST_RATE_GLOBAL_PER_IP }}
                PACTOLE_SECURITY_RATE_LIMITS_AUTH_PER_IP_PER_MINUTE: ${{ secrets.TEST_RATE_AUTH_PER_IP }}
                PACTOLE_SECURITY_RATE_LIMITS_LOGIN_PER_EMAIL_PER15MINUTES: ${{ secrets.TEST_RATE_LOGIN_PER_EMAIL }}
                PACTOLE_SECURITY_RATE_LIMITS_JOIN_PER_IP_PER_MINUTE: ${{ secrets.TEST_RATE_JOIN_PER_IP }}
                PACTOLE_APP_URL: ${{ secrets.TEST_APP_URL }}
                SPRING_MAIL_USERNAME: ${{ secrets.TEST_MAIL_USERNAME }}
                SPRING_MAIL_PASSWORD: ${{ secrets.TEST_MAIL_PASSWORD }}
                PACTOLE_CORS_ORIGINS: ${{ secrets.TEST_CORS_ORIGINS }}
                PACTOLE_AI_BASE_URL: ${{ secrets.TEST_AI_BASE_URL }}
                PACTOLE_AI_CHAT_PATH: ${{ secrets.TEST_AI_CHAT_PATH }}
                PACTOLE_AI_MODEL: ${{ secrets.TEST_AI_MODEL }}
                PACTOLE_AI_VISION_MODEL: ${{ secrets.TEST_AI_VISION_MODEL }}
                PACTOLE_AI_TIMEOUT_SECONDS: ${{ secrets.TEST_AI_TIMEOUT_SECONDS }}
                PACTOLE_AI_CALLS_PER_HOUR: ${{ secrets.TEST_AI_CALLS_PER_HOUR }}
                PACTOLE_AI_CALLS_PER_DAY: ${{ secrets.TEST_AI_CALLS_PER_DAY }}

            - name: Upload rapports de tests
              uses: actions/upload-artifact@v7
              if: always()
              with:
                name: test-reports
                path: backend/target/surefire-reports/
                retention-days: 7

    frontend:
        name: Frontend – Build & Audit
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm audit --audit-level=high
            - run: npm run build

    trivy:
        name: Trivy – Scan
        runs-on: ubuntu-latest
        needs: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 25
                cache: maven
            - name: Pré-remplir le cache Maven
              run: mvn dependency:resolve -B -q
              working-directory: backend
            - name: Installer Trivy
              run: |
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            - name: Scan avec Trivy
              run: |
                trivy fs . \
                  --scanners vuln,misconfig,secret \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed
